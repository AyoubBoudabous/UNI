<div
  class="list-group-item d-flex justify-content-between align-items-center"
  [class.bg-warning]="!pizza().vegetarian"
>
  <img class="rounded-circle" [src]="pizza().image" alt="" />
  @if (pizza().vegetarian) {
    <p class="text-success fw-bold">Végétarienne</p>
  }
  <p class="badge text-bg-dark m-4">{{ pizza().name }}</p>
  <p>Prix : {{ pizza().price }} DT</p>
  <button class="btn btn-dark" type="button" (click)="onDelete()">Supprimer</button>
</div>
