<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exercice 5</title>
    <style>
      h1 {
        border: 1px solid black;
        padding: 10px;
      }

      p {
        border: 1px solid black;
        padding: 10px;
      }
    </style>
  </head>
  <body>
    <h1 id="titre">Mon titre</h1>

    <p id="para">Voici le mot original</p>

    <script>
      function modif_p() {
        let p = document.getElementById("para");
        p.textContent = "Le mot a été modifié !";
        p.style.fontStyle = "italic";
      }

      function center() {
        let h1 = document.getElementsByTagName("h1");
        h1[0].setAttribute("align", "center");
      }

      document.getElementById("titre").addEventListener("click", modif_p);
      document.getElementById("para").addEventListener("click", center);
    </script>
  </body>
</html>
