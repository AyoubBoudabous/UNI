<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <title>Galerie d’art</title>
    <link rel="stylesheet" href="exercice3.css" />
  </head>
  <body>
    <!-- HEADER -->
    <header class="header">
      <h1 class="logo">Galerie d’art</h1>
      <nav class="menu">
        <a href="#">Accueil</a>
        <a href="#">Galerie</a>
        <a href="#">À propos</a>
        <a href="#">Contact</a>
      </nav>
    </header>
    <!-- CONTENU PRINCIPAL -->
    <main class="contenu">
      <h2 class="section-title">Galerie d’Images</h2>
      <div class="galerie">
        <div class="carte">
          <img src="images/paysage.jpg" alt="Paysage" />
          <h3>Paysage</h3>
          <p>Une vue paisible et colorée.</p>
        </div>
        <div class="carte">
          <img src="images/nuitetoilee.jpg" alt="Nuit étoilée" />
          <h3>Nuit étoilée</h3>
          <p>Un ciel nocturne plein de lumière.</p>
        </div>
        <div class="carte">
          <img src="images/iris.jpg" alt="Iris" />
          <h3>Iris</h3>
          <p>La délicatesse d’une fleur en peinture.</p>
        </div>
        <div class="carte">
          <img src="images/medina.jpg" alt="Médina" />
          <h3>Médina</h3>
          <p>Une scène urbaine riche en couleurs.</p>
        </div>
      </div>
    </main>
    <!-- FOOTER -->
    <footer class="footer">
      <p>&copy; 2025 Ma galerie . Tous droits réservés.</p>
    </footer>
  </body>
</html>
